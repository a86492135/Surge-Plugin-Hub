name: Module checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate module metadata and jq syntax
        run: |
          python3 scripts/check_modules.py
          python3 -m unittest discover -s tests
          node tests/test_local_scripts.js
          node --check scripts/amap-inspect.js
          node --check scripts/weibo-launch.js
