name: Sync upstream rules
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SYNC_BRANCH: belief/upstream-sync
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch fixed upstream revisions and apply local branding
        run: python3 scripts/sync_upstream.py
      - name: Validate generated rules and local patches
        run: |
          python3 scripts/check_modules.py
          python3 -m unittest discover -s tests
          node tests/test_local_scripts.js
          node --check scripts/amap-inspect.js
          node --check scripts/weibo-launch.js
      - name: Open or update a PR only when files changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- modules/ manifest.json checksums.sha256 upstream.lock.json upstream-review.json
          if git diff --cached --quiet; then
            echo "No upstream changes; no PR created."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_sha=$(git ls-remote origin "refs/heads/$SYNC_BRANCH" | cut -f1)
          git switch -C "$SYNC_BRANCH"
          git commit -m "chore: sync reviewed upstream rule snapshots"
          git push origin "HEAD:refs/heads/$SYNC_BRANCH" "--force-with-lease=refs/heads/$SYNC_BRANCH:$remote_sha"
          cat > .sync-pr-body.md <<'BODY'
          ## 上游规则同步

          本 PR 更新固定版本的上游规则及脚本引用，保留 Belief 的名称、分类、简短描述与自定义层。

          - 已完成静态校验和本地脚本模拟测试。
          - 未完成手机效果验证，请检查 diff 后再合并。
          - main 分支和 Surge 已发布模块在合并前不会变化。
          - 来源修订及文件摘要见 upstream.lock.json。
          BODY
          existing=$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore: 同步上游去广告规则" --body-file .sync-pr-body.md
          else
            gh pr create --head "$SYNC_BRANCH" --base main --title "chore: 同步上游去广告规则" --body-file .sync-pr-body.md
          fi
